services:
  - type: web
    name: deepgen-ai-service
    runtime: docker
    rootDir: backend-ai-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TAVUS_API_KEY
        sync: false
      - key: TAVUS_REPLICA_ID
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://deepgen-ai.onrender.com
